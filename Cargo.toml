[workspace]
members = [
    "live", "my-redis"]
resolver = "2"

[workspace.dependencies]
# Common
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
